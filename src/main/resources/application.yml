spring:
  application:
    name: RAG

  # 配置火山引擎（豆包）的API
  ai:
    openai:
      # 火山引擎网关地址
      # Chat API 使用原生兼容接口
      base-url: https://ark.cn-beijing.volces.com/api/v3
      # 你的火山引擎API Key
      api-key: ${ARK_API_KEY}
      # Embedding配置 - 禁用自动配置，使用自定义实现
      embedding:
        enabled: false
      # Chat模型（豆包的对话模型）
      chat:
        options:
          model: ${CHAT_MODEL:ep-20260419235315-sv4kp}  # 替换为你的推理端点ID

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Milvus 向量数据库配置
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: rag_documents
  dimension: 2048  # 嵌入向量维度

# 自定义配置
volcengine:
  api-key: ${ARK_API_KEY}
  embedding:
    # Embedding端点（多模态模型）
    model: ep-20260420014217-l6bqr
  chat:
    # Chat端点（对话模型）
    model: ep-20260419235315-sv4kp

# 嵌入向量缓存配置
embedding:
  cache:
    enabled: true  # 是否启用缓存
    ttl: 86400  # 缓存过期时间（秒），默认 24 小时

# 文档分块配置
document:
  chunk:
    min-size: 200  # 最小块大小
    max-size: 800  # 最大块大小
    target-size: 500  # 目标块大小
    overlap: 100  # 块重叠大小（保持上下文连续性）

# 向量存储字段配置
vector-store:
  fields:
    id: id  # 文档块ID字段名
    document-id: document_id  # 文档ID字段名
    vector: vector  # 向量字段名
    content: content  # 内容字段名
    source: source  # 来源字段名
    chunk-index: chunk_index  # 块索引字段名
  index:
    nlist: 128  # IVF_FLAT索引参数

# 检索配置
retrieval:
  top-k: 3  # 检索返回的最相关文档块数量
  rerank:
    enabled: true  # 是否启用重排序
    top-k: 5  # 重排序前检索的候选块数量
    final-top-k: 3  # 重排序后返回的最终块数量
    method: keyword  # 重排序方法：keyword（关键词匹配）、semantic（语义相似度）
  bm25:
    enabled: false  # 是否启用BM25关键词检索（混合检索）
    weight: 0.3  # BM25权重（0-1之间，向量检索权重为 1-weight）
    top-k: 5  # BM25检索的候选块数量

# API重试配置
retry:
  enabled: true  # 是否启用重试
  max-attempts: 3  # 最大重试次数
  initial-delay: 1000  # 初始延迟（毫秒）
  max-delay: 10000  # 最大延迟（毫秒）
  multiplier: 2.0  # 延迟倍数（指数退避）

# Prometheus指标配置
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  metrics:
    tags:
      application: rag-system
    distribution:
      percentiles-histogram:
        "[rag.retrieval.duration]": true   # 启用直方图
        "[rag.milvus.query.duration]": true

# 日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.example.rag: INFO
    io.milvus: WARN

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs  # OpenAPI 规范地址（Postman 可通过 Import -> Link 导入）
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method  # 接口按请求方法排序
    tags-sorter: alpha

# 服务器端口配置
server:
  port: 8081
